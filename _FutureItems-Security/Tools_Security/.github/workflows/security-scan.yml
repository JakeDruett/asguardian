name: Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run weekly security scan
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Security Scan
        id: security-scan
        working-directory: .
        run: python security_api.py all . -f sarif -o results.sarif

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324  # v3.37.7
        if: always()
        with:
          sarif_file: results.sarif
          category: security-toolkit

      - name: Require SARIF output
        run: test -s results.sarif

      - name: Generate JSON Report
        working-directory: .
        run: python security_api.py all . -f json -o security-report.json

      - name: Upload Security Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: security-report
          path: security-report.json

      - name: Require JSON report
        run: test -s security-report.json

      - name: Check for Critical Issues
        run: |
          python -c "
          import json, sys
          try:
              with open('security-report.json', encoding='utf-8') as handle:
                  data = json.load(handle)
          except (OSError, json.JSONDecodeError) as exc:
              print('::error::Unreadable security-report.json: ' + str(exc))
              sys.exit(1)
          if not isinstance(data, dict):
              print('::error::security-report.json is not an object')
              sys.exit(1)
          scans = data.get('scans')
          if not isinstance(scans, dict) or not scans:
              print('::error::security-report.json has no scans')
              sys.exit(1)
          failed = []
          for name, scan in scans.items():
              if not isinstance(scan, dict) or 'total_issues' not in scan:
                  failed.append(str(name))
                  continue
              total = scan['total_issues']
              if type(total) is not int or total < 0:
                  failed.append(str(name))
          if failed:
              print('::error::Scan failed or missing total_issues for: ' + ', '.join(failed))
              sys.exit(1)
          critical = 0
          for scan in scans.values():
              by_severity = scan.get('by_severity') if isinstance(scan, dict) else None
              if isinstance(by_severity, dict):
                  value = by_severity.get('CRITICAL', 0)
                  if type(value) is int:
                      critical += value
          if critical > 0:
              print(f'::error::Found {critical} critical security issues!')
              sys.exit(1)
          "

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Scan for secrets
        run: |
          python secrets_scanner.py .
          exit_code=$?
          if [ $exit_code -eq 2 ]; then
            echo "::error::Critical secrets found in codebase!"
            exit 1
          fi

  dependency-check:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Check dependencies
        run: |
          python dependency_checker.py .

  code-quality:
    name: Code Security Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Run code security scans
        run: |
          echo "=== SQL Injection Scan ==="
          python sql_injection_scanner.py .
          echo ""
          echo "=== XSS Scan ==="
          python xss_scanner.py .
          echo ""
          echo "=== Command Injection Scan ==="
          python command_injection_scanner.py .

  test-scanners:
    name: Test Scanners
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Run scanner tests
        run: |
          pytest tests/ -v
