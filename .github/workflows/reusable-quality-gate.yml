# =========================================================================
# Reusable quality gate for consumer repositories.
#
# Lets any repo in the suite run asguardian's toolchain-orchestrating
# analysers (Rust/clippy+audit, Node/eslint+npm-audit+tsc, Go/vet+build+
# fmt+test+vulncheck) as a CI job, without vendoring asguardian or
# publishing it to PyPI first. It checks out this repo at `asguardian-ref`
# alongside the caller's own checkout and installs it editable from source.
#
# Usage from a consumer repo (e.g. GVR-Database, a Rust crate):
#
#   jobs:
#     quality-gate:
#       uses: primordial-creations/asguardian/.github/workflows/reusable-quality-gate.yml@main
#       with:
#         language: rust
#         scan-path: .
#
# See _Docs/CI/Consumer-Wiring.md for the exact snippet per language and
# the per-repo list this was written against.
# =========================================================================
name: Reusable Quality Gate

on:
  workflow_call:
    inputs:
      language:
        description: "Which toolchain analyser family to run: rust, node, or go"
        required: true
        type: string
      scan-path:
        description: "Path (relative to the caller repo root) to scan"
        required: false
        type: string
        default: "."
      checks:
        description: >
          Comma-separated subset of `heimdall quality` subcommands to run.
          Defaults to every check for the chosen language:
          rust -> rust-clippy,rust-audit
          node -> node-lint,node-audit,node-typecheck
          go   -> go-vet,go-build,go-fmt,go-test,go-vuln
        required: false
        type: string
        default: ""
      asguardian-ref:
        description: "Branch, tag, or commit of asguardian itself to install"
        required: false
        type: string
        default: "main"
      timeout-seconds:
        description: "Per-check subprocess timeout passed to heimdall"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (${{ inputs.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout asguardian
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: primordial-creations/asguardian
          ref: ${{ inputs.asguardian-ref }}
          path: .asguardian-src
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install asguardian
        run: |
          python -m pip install --upgrade pip
          pip install -e ./.asguardian-src

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: ${{ inputs.scan-path }}/go.mod

      - name: Set up Node
        if: inputs.language == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Set up Rust
        if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable, pinned 2026-09-03
        with:
          components: clippy

      - name: Install cargo-audit
        if: inputs.language == 'rust'
        run: cargo install cargo-audit --locked

      - name: Install govulncheck
        if: inputs.language == 'go'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Resolve checks to run
        id: checks
        run: |
          if [ -n "${{ inputs.checks }}" ]; then
            echo "list=${{ inputs.checks }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.language }}" = "rust" ]; then
            echo "list=rust-clippy,rust-audit" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.language }}" = "node" ]; then
            echo "list=node-lint,node-audit,node-typecheck" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.language }}" = "go" ]; then
            echo "list=go-vet,go-build,go-fmt,go-test,go-vuln" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown language: ${{ inputs.language }}" >&2
            exit 1
          fi

      - name: Run heimdall quality checks
        run: |
          set -e
          IFS=',' read -ra CHECK_LIST <<< "${{ steps.checks.outputs.list }}"
          TIMEOUT_ARGS=()
          if [ -n "${{ inputs.timeout-seconds }}" ]; then
            TIMEOUT_ARGS=(--timeout "${{ inputs.timeout-seconds }}")
          fi
          FAILED=0
          for check in "${CHECK_LIST[@]}"; do
            echo "::group::heimdall quality $check ${{ inputs.scan-path }}"
            heimdall quality "$check" "${{ inputs.scan-path }}" "${TIMEOUT_ARGS[@]}" || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED
