name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fork PRs: enable "Require approval for all outside collaborators" in
# repo Settings → Actions → General. Workflow YAML cannot set that gate.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'arc-x86' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'arc-x86' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test extras (push/main only)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e ".[test]"

      - name: Install mypy without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic pyyaml playwright httpx

      - name: Run mypy
        run: mypy Asgard/
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'arc-x86' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (push/main only — trusted)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Deliberately does not install the package itself: a pull request's code
      # must not be executed through setup hooks on a trusted runner. That means
      # this list stands in for pyproject.toml's [test] extra by hand, and it had
      # drifted from it -- so on pull requests, which is the gate that actually
      # reviews changes, the tree-sitter grammars and pylint were absent and
      # playwright was unpinned. The [test] extra's own comments say those
      # dependencies exist because "CI silently ran those tests against the
      # degraded path" and a security test "had never run"; both were still true
      # here. Keep this list in step with [test] and [treesitter] in
      # pyproject.toml.
      - name: Install test deps without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0.0" "pytest-asyncio>=0.21.0" "pytest-mock>=3.10.0" "pytest-cov>=4.0.0" pydantic pyyaml httpx \
            "playwright==1.56.0" "pylint>=3.0" \
            "tree-sitter==0.25.2" tree-sitter-python tree-sitter-javascript tree-sitter-typescript \
            tree-sitter-java tree-sitter-go tree-sitter-ruby tree-sitter-php \
            tree-sitter-c-sharp tree-sitter-cpp tree-sitter-rust tree-sitter-c

      # The 79 Freya L1 tests skip themselves unless a real Chromium matching
      # the pinned playwright is launchable. Without this they were skipping in
      # CI, silently, whatever the pin said.
      - name: Install the Chromium playwright is pinned against
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest Asgard_Test/ -v --tb=short --ignore=Asgard_Test/fixtures
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest Asgard_Test/ --cov=Asgard --cov-report=term-missing --cov-report=xml --ignore=Asgard_Test/fixtures
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
