name: Publish to PyPI

# Tag protection (repo Settings → Rules → Rulesets) should allow only
# v[0-9].* and require a reviewer before creating release tags.
"on":
  push:
    tags:
      - "v[0-9].*"

permissions: {}

jobs:
  build:
    name: Build
    runs-on: arc-x86
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Checksum artifacts
        run: sha256sum dist/* | tee dist/SHA256SUMS

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: Attest
    needs: build
    runs-on: arc-x86
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 15
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/**

  publish:
    name: Publish
    needs: [build, provenance]
    runs-on: arc-x86
    environment: pypi
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Verify checksums
        run: sha256sum -c dist/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
